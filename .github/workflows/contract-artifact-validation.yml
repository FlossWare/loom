name: Contract Artifact Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.22,<5"
      - name: Validate schemas and fixtures
        run: python tools/validate_contract_artifacts.py
      - name: Test conformance assertion behavior
        run: python -m unittest discover -s tests -p 'test_*.py' -v
